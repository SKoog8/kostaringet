name: Daglig ombyggnad

# Bygger om sajten på Vercel varje natt, så att erbjudanden vars slutdatum
# har passerat visas som avslutade. Kräver hemligheten VERCEL_DEPLOY_HOOK
# (Vercel → Project → Settings → Git → Deploy Hooks). Utan den gör jobbet inget.

on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Starta ny deploy på Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK saknas – hoppar över."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
